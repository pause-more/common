<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>오프라인 - 오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <style>
        * { box-sizing:border-box; }
        html,
        body { width:100%; min-height:100%; margin:0; }
        body {
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:32px 18px;
            background:#f7f9fb;
            color:#1b1b1b;
            font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }
        .offlineShell {
            width:100%;
            max-width:480px;
            padding:36px 34px;
            border:1px solid #e5e8ec;
            border-radius:8px;
            background:#fff;
            text-align:center;
            box-shadow:0 18px 45px rgba(15, 23, 42, .08);
        }
        .offlineLogo {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:54px;
            height:54px;
            margin:0 0 22px;
            border:1px solid #e5e8ec;
            border-radius:8px;
            background:#fff;
        }
        .offlineLogo img { display:block; width:34px; height:auto; }
        h1 {
            margin:0;
            font-size:24px;
            line-height:1.35;
            font-weight:700;
            letter-spacing:0;
        }
        p {
            margin:14px 0 0;
            color:#667085;
            font-size:15px;
            line-height:1.65;
            letter-spacing:0;
        }
        .offlineActions {
            display:flex;
            gap:10px;
            justify-content:center;
            margin:26px 0 0;
        }
        .offlineButton {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-width:118px;
            height:44px;
            padding:0 18px;
            border:1px solid #d7dce2;
            border-radius:6px;
            background:#fff;
            color:#1b1b1b;
            font-size:14px;
            font-weight:700;
            text-decoration:none;
            cursor:pointer;
        }
        .offlineButtonPrimary {
            border-color:#00aee6;
            background:#0373ef;
            color:#fff;
        }
        @media (max-width:720px) {
            .offlineShell { padding:30px 22px; }
            .offlineActions { flex-direction:column; }
            .offlineButton { width:100%; }
        }
    </style>
</head>
<body>
    <main class="offlineShell">
        <span class="offlineLogo"><img src="/img/symbol.svg" alt=""></span>
        <h1>네트워크 연결을 확인해주세요.</h1>
        <p>현재 오토원워크에 연결할 수 없습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.</p>
        <div class="offlineActions">
            <button type="button" class="offlineButton offlineButtonPrimary" onclick="window.location.reload()">다시 시도</button>
            <a class="offlineButton" href="/index.html">홈으로</a>
        </div>
    </main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
    <!-- ⓒ pause-more.com -->
    <meta charset="utf-8">
    <title>오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
    <link href="../layout/app.css?v=20260530-modal-keys1" rel="stylesheet">
    <link href="./mail.css?v=20260530-modal-keys1" rel="stylesheet">
    <script type="module" src="../layout/app.js?v=20260530-modal-keys1"></script>
    <script type="module" src="./mailLayout.js?v=20260530-toast-count1"></script>
    <script type="module" src="./all.js?v=20260530-move-toast1"></script>
</head>
<body class="mailPageLayout workbenchLayoutPage">
    <div id="wrap">
        <div id="container">
            <div id="contents" class="contents">
                <div data-include-html="/gnbMenu.html"></div>

                <div class="mainArea">
                    <div class="siteSheet">
                    <div class="contents_">
                            <div class="cont_flex_area">
                                <div class="mailArea">
                                    <div class="mail_topArea">
                                        <div class="page_title">
                                            <h3 class="titleLabel"><span>메일</span><span class="divider">/</span><strong>전체메일</strong></h3>
                                            <h2>전체메일</h2>
                                        </div>

                                        <div class="mailActionBar">
                                            <div class="actionLeft">
                                                <div class="selectAction">
                                                    <div class="selectAllBox">
                                                        <input type="checkbox" id="allCheck">
                                                        <label for="allCheck"></label>
                                                        <button type="button" class="selectArrowBtn"><ion-icon name="caret-down-outline"></ion-icon></button>
                                                    </div>
                                                    <div class="selectDropdown">
                                                        <button type="button" data-select="all">전체선택</button>
                                                        <button type="button" data-select="read">읽은메일</button>
                                                        <button type="button" data-select="unread">읽지않은메일</button>
                                                        <button type="button" data-select="starred">중요메일</button>
                                                        <button type="button" data-select="clear">선택해제</button>
                                                    </div>
                                                </div>
                                                <button type="button">안읽음</button>
                                                <button type="button">삭제</button>
                                                <button type="button">답장</button>
                                                <button type="button">전달</button>

                                                <div class="moveAction">
                                                    <button type="button" class="moveBtn">이동<ion-icon name="caret-down-outline"></ion-icon></button>
                                                    <div class="moveDropdown">
                                                        <button type="button" data-move-folder="inbox">받은메일함</button>
                                                        <button type="button" data-move-folder="my1">나의메일함 1</button>
                                                        <button type="button" data-move-folder="my2">나의메일함 2</button>
                                                        <button type="button" data-move-folder="my3">나의메일함 3</button>
                                                        <button type="button" data-move-folder="trash">휴지통</button>
                                                    </div>
                                                </div>

                                            </div>
                                            <div class="actionRight">
                                                <div class="mailSearchBox mailActionSearchBox">
                                                    <ion-icon name="search-outline"></ion-icon><input type="text" placeholder="메일 검색" aria-label="메일 검색">
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="cont_flex_area mailListWrap">
                                        <div class="emptyRow">메일을 불러오는 중입니다.</div>
                                    </div>

                                    <div class="mailPagination"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
    <!-- ⓒ pause-more.com -->
    <meta charset="utf-8">
    <title>오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/xeicon/2/xeicon.min.css">
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
    <link href="./layout/app.css?v=20260530-modal-keys1" rel="stylesheet">
    <link href="findPassword.css?v=20260521-6" rel="stylesheet">
    <script type="module" src="./layout/auth.js?v=20260521-6"></script>
    <script type="module" src="findPassword.js?v=20260521-6"></script>
</head>
<body class="findPasswordPage">
    <div class="findPasswordWrap">
        <img class="findPasswordHero" src="/img/lock_img.png" alt="비밀번호 재설정">
        <h1>오토원워크 계정의<br>비밀번호를 재설정합니다.</h1>
        <p class="findPasswordLead">임시 비밀번호 재발급을 위해 아래 계정 정보를 입력해주세요.</p>
        <fieldset class="findPasswordForm">
            <label for="findUserId">아이디</label>
            <input type="text" id="findUserId" class="findPasswordInput" autocomplete="username" autofocus>
            <label for="findUserName">이름</label>
            <input type="text" id="findUserName" class="findPasswordInput" autocomplete="name">
            <label for="findBirthDate">생년월일</label>
            <input type="text" id="findBirthDate" class="findPasswordInput" placeholder="예: 19901231" inputmode="numeric" maxlength="8">
        </fieldset>
        <div class="findPasswordMsg" id="findPasswordMsg"></div>
        <button type="button" class="findPasswordBtn" id="findPasswordBtn" disabled>임시 비밀번호 발급</button>
    </div>
</body>
</html>

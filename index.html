<!doctype html>
<html lang="ko">
<head>
    <!-- ⓒ pause-more.com -->
    <meta charset="utf-8">
    <title>오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/xeicon/2/xeicon.min.css">
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
    <link href="./layout/app.css?v=20260528-profile-settings15" rel="stylesheet">
    <link href="mainArea.css?v=20260529-dashboard-home29" rel="stylesheet">
    <script type="module" src="./layout/app.js?v=20260528-profile-settings15"></script>
    <script type="module" src="mainArea.js?v=20260529-dashboard-home30"></script>
</head>
<body class="homePage workbenchLayoutPage">
    <div id="wrap">
        <div id="container">
            <div id="contents" class="contents">
                <div data-include-html="/gnbMenu.html"></div>

                <div class="mainArea">
                    <div class="siteSheet dashboardPage dashboardHome">
                        <div class="dashboardHomeColumn">
                            <section class="dashboardCard dashboardCard--summary">
                                <h3 class="dashboardGreeting"></h3>
                                <strong class="dashboardNowLabel">-</strong>
                                <article class="dashboardAttendanceBox">
                                    <div class="dashboardAttendanceSummary">
                                        <div class="dashboardAttendanceMetric">
                                            <span>출근 시간</span>
                                            <strong class="dashboardCheckInValue">-</strong>
                                        </div>
                                        <div class="dashboardAttendanceArrow" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" fill="#7f8287" viewBox="0 0 256 256"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
                                        </div>
                                        <div class="dashboardAttendanceMetric">
                                            <span>퇴근 시간</span>
                                            <strong class="dashboardCheckOutValue">-</strong>
                                        </div>
                                    </div>
                                    <div class="dashboardAttendanceActions">
                                        <button type="button" class="dashboardActionBtn dashboardCheckInBtn">출근하기</button>
                                        <button type="button" class="dashboardActionBtn dashboardCheckOutBtn">퇴근하기</button>
                                    </div>
                                </article>
                                <dl class="dashboardMiniStats">
                                    <div><dt>오늘 내 일정</dt><dd class="dashboardTodayScheduleCount">0</dd></div>
                                    <div><dt>결재 대기 문서</dt><dd class="dashboardPendingCount">0</dd></div>
                                    <div><dt>팀 보드 새글</dt><dd class="dashboardTeamCount">0</dd></div>
                                    <div><dt>내 잔여 연차</dt><dd class="dashboardVacationValue">-</dd></div>
                                </dl>
                            </section>

                            <section class="dashboardCard dashboardCard--notice">
                                <div class="dashboardSectionHead">
                                    <strong class="dashboardSectionTitle">공지사항</strong>
                                </div>
                                <div class="dashboardNoticeList"></div>
                            </section>

                            <section class="dashboardCard dashboardCard--birthdays">
                                <div class="dashboardSectionHead">
                                    <strong class="dashboardSectionTitle">생일</strong>
                                </div>
                                <div class="dashboardBirthdayList"></div>
                                <div class="dashboardBirthdayControls" aria-label="생일 목록 이동">
                                    <button type="button" class="dashboardBirthdayNav dashboardBirthdayPrev" aria-label="이전 생일">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
                                    </button>
                                    <button type="button" class="dashboardBirthdayNav dashboardBirthdayNext" aria-label="다음 생일">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                                    </button>
                                </div>
                            </section>
                        </div>

                        <div class="dashboardHomeColumn">
                            <section class="dashboardCard dashboardCard--mail">
                                <div class="dashboardSectionHead">
                                    <strong class="dashboardSectionTitle">메일함</strong>
                                    <span class="dashboardMailMeta">용량 <em class="dashboardMailboxUsage">-</em> / 500MB</span>
                                </div>
                                <div class="dashboardMailList"></div>
                            </section>

                            <section class="dashboardCard dashboardCard--approval">
                                <div class="dashboardSectionHead">
                                    <strong class="dashboardSectionTitle">결재 문서</strong>
                                </div>
                                <div class="dashboardApprovalPanel">
                                    <div class="dashboardApprovalBody">
                                        <div class="dashboardApprovalEmpty">불러오는 중입니다.</div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        <div class="dashboardHomeColumn">
                            <section class="dashboardCard dashboardCard--team">
                                <div class="dashboardSectionHead">
                                    <strong class="dashboardSectionTitle">팀 보드</strong>
                                </div>
                                <div class="dashboardTeamList"></div>
                            </section>

                            <section class="dashboardCard dashboardCard--miniCalendar">
                                <div class="dashboardSectionHead">
                                    <strong class="dashboardSectionTitle">캘린더</strong>
                                </div>
                                <div class="dashboardMiniCalendar">
                                    <div class="dashboardMiniCalendarHead">
                                        <button type="button" class="dashboardMiniCalendarNav dashboardMiniCalendarPrev" aria-label="이전 달">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
                                        </button>
                                        <strong class="dashboardMiniCalendarMonth">-</strong>
                                        <button type="button" class="dashboardMiniCalendarNav dashboardMiniCalendarNext" aria-label="다음 달">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                                        </button>
                                    </div>
                                    <div class="dashboardMiniCalendarWeekdays" aria-hidden="true">
                                        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                                    </div>
                                    <div class="dashboardMiniCalendarGrid"></div>
                                    <div class="dashboardMiniAgenda">
                                        <div class="dashboardMiniAgendaDate"></div>
                                        <div class="dashboardMiniAgendaList"></div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <title>오토원워크</title>
    <style>
        /* 기본 레이아웃 및 폰트 설정 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5; 
            padding: 50px;
        }

        .chat-container {
            display: flex;
            align-items: flex-end; 
            gap: 8px; 
        }

        /* 말풍선 본체 스타일 */
        .chat-bubble {
            position: relative;
            background-color: #ffffff;
            border: 1.5px solid #d5d5d5;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 17px;
            color: #1b1b1b;
            /* 이전 코드에 있던 z-index 제거: 구조를 단순화하여 겹침 문제 해결 */
        }

        /* 안정적이고 깔끔한 꼬리 구현 */
        .chat-bubble::before {
            content: "";
            position: absolute;
            top: 15px;          /* 모서리 둥글기가 끝나는 직선 구간의 시작점 */
            left: -6px;         /* 말풍선 밖으로 살짝 빼줌 */
            width: 10px;        /* 꼬리 크기 */
            height: 10px;
            background-color: #ffffff;        /* 말풍선과 동일한 흰색 배경으로 본체의 테두리를 덮어버림 */
            border-top: 1.5px solid #d5d5d5;  /* 꼬리 위쪽 선 */
            border-left: 1.5px solid #d5d5d5; /* 꼬리 왼쪽 선 */
            border-top-left-radius: 2px;      /* 꼬리 끝을 살짝 부드럽게 */
            transform: rotate(-45deg);        /* 45도 회전하여 완벽한 V자(마름모) 형태 생성 */
        }

        /* 시간 및 읽음 표시 컨테이너 */
        .chat-meta {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 2px;
        }

        .meta-top {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #888888;
            margin-bottom: 2px;
        }

        .meta-time {
            font-size: 13px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-bubble">안녕하세요</div>
        <div class="chat-meta">
            <div class="meta-top">
                <span>1</span>
                <span>&gt;</span>
            </div>
            <div class="meta-time">오후 02:03</div>
        </div>
    </div>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
    <!-- ⓒ pause-more.com -->
    <meta charset="utf-8">
    <title>오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/xeicon/2/xeicon.min.css">
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
    <link href="../layout/app.css?v=20260528-profile-settings15" rel="stylesheet">
    <link href="./calendar.css?v=20260522-slide1" rel="stylesheet">
    <link href="./calendarLayout.css?v=20260522-slide1" rel="stylesheet">
    <script type="module" src="../layout/app.js?v=20260528-profile-settings15"></script>
    <script type="module" src="./calendarLayout.js?v=20260522-sidebar1"></script>
    <script type="module" src="./team.js?v=20260519-1"></script>
</head>
<body class="calendarPageLayout workbenchLayoutPage">
    <div id="wrap">
        <div id="container">
            <div id="contents" class="contents">
                <div data-include-html="/gnbMenu.html"></div>

                <div class="mainArea">
                    <div class="siteSheet calendarSheet">
                        <div class="page_title">
                            <h3 class="titleLabel"><span>캘린더</span><span class="divider">/</span><strong>팀/부서 캘린더</strong></h3>
                            <div class="approvalDashboardTitleRow">
                                <h2>팀/부서 캘린더</h2>
                            </div>
                        </div>
                        <div class="contents_">
                            <div class="cont_flex_area">
                                <div class="calendarPage calendarPage--team" data-calendar-scope="team">
                                    <div class="calendarShell">
                                        <div class="calendarMonthHeader">
                                            <div class="calendarMonthActions">
                                                <button type="button" class="calendarNavBtn calendarPrevBtn" aria-label="이전 달"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#1b1b1b" viewBox="0 0 24 24"><path d="M14.29 6.29 8.59 12l5.7 5.71 1.42-1.42-4.3-4.29 4.3-4.29z"></path></svg></button>
                                                <button type="button" class="calendarNavBtn calendarNextBtn" aria-label="다음 달"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#1b1b1b" viewBox="0 0 24 24"><path d="m9.71 17.71 5.7-5.71-5.7-5.71-1.42 1.42 4.3 4.29-4.3 4.29z"></path></svg></button>
                                                <select class="calendarPageMoveSelect" aria-label="캘린더 이동">
                                                    <option value="my.html">내 캘린더</option>
                                                    <option value="team.html" selected>팀/부서 캘린더</option>
                                                    <option value="company-wide.html">전사 일정</option>
                                                </select>
                                            </div>
                                            <div class="calendarMonthTitleWrap">
                                                <strong class="calendarCurrentMonth"></strong>
                                            </div>
                                            <div class="calendarHeaderTools">
                                                <button type="button" class="calendarAddBtn" aria-label="일정 추가"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24"><path d="M3 13h8v8h2v-8h8v-2h-8V3h-2v8H3z"></path></svg></button>
                                            </div>
                                        </div>
                                        <div class="calendarBoard calendarBoard--clean">
                                            <div class="calendarWeekHead">
                                                <span>일</span>
                                                <span>월</span>
                                                <span>화</span>
                                                <span>수</span>
                                                <span>목</span>
                                                <span>금</span>
                                                <span>토</span>
                                            </div>
                                            <div class="calendarGrid"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="calendarModal" style="display:none;">
                        <div class="calendarModalDim"></div>
                        <div class="calendarModalDialog">
                            <div class="calendarModalHead">
                                <button type="button" class="calendarModalCloseBtn" aria-label="닫기"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
                            </div>
                            <div class="calendarModalBody">
                                <input type="hidden" class="calendarEventId">
                                <div class="calendarField calendarFieldTitle">
                                    <input type="text" id="calendarTitle" class="calendarTitleInput" placeholder="일정 제목을 입력하세요.">
                                </div>
                                <div class="calendarField calendarSectionRow calendarScheduleField calendarDayRow calendarTimeRow fieldRow">
                                    <div class="calendarScheduleBody calendarDateRange dataChk">
                                        <div class="calendarScheduleRow">
                                            <span class="calendarScheduleLead"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
                                            <div class="calendarScheduleLine calendarScheduleControls">
                                                <div class="calendarDateSelectGroup">
                                                    <div class="calendarSelectBox">
                                                        <select id="calendarStartYear" class="calendarDateSelect"><option value="">연도</option></select>
                                                        <span class="calendarSelectText">연도</span>
                                                    </div>
                                                    <div class="calendarSelectBox">
                                                        <select id="calendarStartMonth" class="calendarDateSelect"><option value="">월</option></select>
                                                        <span class="calendarSelectText">월</span>
                                                    </div>
                                                    <div class="calendarSelectBox">
                                                        <select id="calendarStartDay" class="calendarDateSelect"><option value="">일</option></select>
                                                        <span class="calendarSelectText">일</span>
                                                    </div>
                                                </div>
                                                <input type="hidden" id="calendarStartDate" class="calendarStartInput">
                                                <div class="calendarSelectBox calendarSelectBox--time">
                                                    <select id="calendarStartTime" class="calendarTimeSelect">
                                                        <option value="">시간</option>
                                                    </select>
                                                    <span class="calendarSelectText">시간</span>
                                                </div>
                                                <input type="hidden" class="calendarStartTimeInput">
                                            </div>
                                        </div>
                                        <div class="calendarScheduleRow">
                                            <span class="calendarScheduleLead calendarScheduleLead--empty" aria-hidden="true"></span>
                                            <div class="calendarScheduleLine calendarScheduleControls">
                                                <div class="calendarDateSelectGroup">
                                                    <div class="calendarSelectBox">
                                                        <select id="calendarEndYear" class="calendarDateSelect"><option value="">연도</option></select>
                                                        <span class="calendarSelectText">연도</span>
                                                    </div>
                                                    <div class="calendarSelectBox">
                                                        <select id="calendarEndMonth" class="calendarDateSelect"><option value="">월</option></select>
                                                        <span class="calendarSelectText">월</span>
                                                    </div>
                                                    <div class="calendarSelectBox">
                                                        <select id="calendarEndDay" class="calendarDateSelect"><option value="">일</option></select>
                                                        <span class="calendarSelectText">일</span>
                                                    </div>
                                                </div>
                                                <input type="hidden" class="calendarEndInput">
                                                <div class="calendarSelectBox calendarSelectBox--time">
                                                    <select id="calendarEndTime" class="calendarTimeSelect">
                                                        <option value="">시간</option>
                                                    </select>
                                                    <span class="calendarSelectText">시간</span>
                                                </div>
                                                <input type="hidden" class="calendarEndTimeInput">
                                            </div>
                                        </div>
                                        <div class="calendarScheduleRow last">
                                            <span class="calendarScheduleLead calendarScheduleLead--empty" aria-hidden="true"></span>
                                            <div class="calendarSectionSide calendarScheduleSideRow">
                                                <label class="calendarAllDayCheck">
                                                    <span>종일</span>
                                                    <input type="checkbox" class="calendarAllDayInput">
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="calendarField calendarSectionRow fieldRow">
                                    <label for="calendarLocation" class="calendarSectionLabel"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></label>
                                    <input type="text" id="calendarLocation" class="calendarLocationInput" placeholder="장소">
                                </div>
                                <div class="calendarField calendarSectionRow calendarSectionColumn fieldRow">
                                    <label for="calendarMemo" class="calendarSectionLabel"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M12 2v4"/><path d="M16 2v4"/><rect width="16" height="18" x="4" y="4" rx="2"/><path d="M8 10h6"/><path d="M8 14h8"/><path d="M8 18h5"/></svg></label>
                                    <input type="text" id="calendarMemo" class="calendarMemoInput" placeholder="메모">
                                </div>
                                <div class="calendarField calendarSectionRow fieldRow">
                                    <span class="calendarFieldLegend calendarSectionLabel"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3H4v7l9.59 9.59a2 2 0 0 0 2.82 0l4.18-4.18a2 2 0 0 0 0-2.82Z"/><path d="M7 7h.01"/></svg></span>
                                    <div class="calendarLabelGroup">
                                        <label class="calendarLabelOption">
                                            <input type="radio" name="calendarLabelColor" class="calendarLabelInput" value="#ffdf89" checked>
                                            <span class="calendarLabelChip" style="background-color:#ffdf89;color:#ffdf89;"></span>
                                        </label>
                                        <label class="calendarLabelOption">
                                            <input type="radio" name="calendarLabelColor" class="calendarLabelInput" value="#ffb0b0">
                                            <span class="calendarLabelChip" style="background-color:#ffb0b0;color:#ffb0b0;"></span>
                                        </label>
                                        <label class="calendarLabelOption">
                                            <input type="radio" name="calendarLabelColor" class="calendarLabelInput" value="#9ff28e">
                                            <span class="calendarLabelChip" style="background-color:#9ff28e;color:#9ff28e;"></span>
                                        </label>
                                        <label class="calendarLabelOption">
                                            <input type="radio" name="calendarLabelColor" class="calendarLabelInput" value="#b9acf9">
                                            <span class="calendarLabelChip" style="background-color:#b9acf9;color:#b9acf9;"></span>
                                        </label>
                                        <label class="calendarLabelOption">
                                            <input type="radio" name="calendarLabelColor" class="calendarLabelInput" value="#cdae89">
                                            <span class="calendarLabelChip" style="background-color:#cdae89;color:#cdae89;"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="calendarField calendarSectionRow fieldRow">
                                    <label for="calendarAlert" class="calendarSectionLabel"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></label>
                                    <select id="calendarAlert" class="calendarAlertInput">
                                        <option value="none">알림 안 함</option>
                                        <option value="at-time">정시 알림</option>
                                        <option value="10-min">10분 전</option>
                                        <option value="30-min">30분 전</option>
                                        <option value="1-hour">1시간 전</option>
                                        <option value="1-day">1일 전</option>
                                    </select>
                                </div>
                                <div class="calendarField calendarSectionRow fieldRow last2">
                                    <label for="calendarVisibility" class="calendarSectionLabel"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#1b1b1b" viewBox="0 0 24 24"><path d="M19 4h-2V2h-2v2H9V2H7v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2M5 20V8h14V6v14z"></path></svg></label>
                                    <select id="calendarVisibility" class="calendarAlertInput calendarVisibilitySelect">
                                        <option value="private">내 캘린더</option>
                                        <option value="team" selected>팀/부서 캘린더</option>
                                    </select>
                                </div>
                                <div class="calendarModalActions">
                                    <button type="button" class="calendarDeleteBtn">삭제</button>
                                    <button type="button" class="calendarSaveBtn">일정 만들기</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/xeicon/2/xeicon.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link href="../layout/app.css?v=20260530-modal-keys1" rel="stylesheet">
    <link href="./admin.css?v=20260527-admin-sidebar20" rel="stylesheet">
    <script type="module" src="../layout/auth.js?v=20260513-8"></script>
    <script type="module" src="../layout/app.js?v=20260530-modal-keys1"></script>
    <script src="./adminLayout.js?v=20260527-admin-sidebar20"></script>
    <script type="module" src="./employees.js?v=20260520-3"></script>
</head>
<body class="adminPageLayout workbenchLayoutPage is-admin-layout">
    <div id="wrap">
        <div id="container">
            <div id="contents" class="contents">
                <div data-include-html="/gnbMenu.html"></div>
                <div class="mainArea">
    <div class="siteSheet">
        <div class="titleArea employeeAdminTitleArea">
            <div class="employeeAdminTitleMain">
                <h3>구성원 관리</h3>
                <span class="employeeCountText">총 0명</span>
            </div>
            <div class="employeeSectionActions">
                <div class="employeeSearchBar">
                    <input type="search" id="employeeSearchInput" class="employeeSearchInput" placeholder="구성원 이름 검색">
                </div>
                <button type="button" class="employeeSecondaryBtn" id="departmentManageBtn">부서 관리</button>
                <button type="button" class="employeePrimaryBtn" id="employeeOpenModalBtn">구성원 추가</button>
            </div>
        </div>
        <div class="settingsArea employeeAdminPage">
            <div class="employeeCard memberList">
                <div class="employeeTableWrap">
                    <table class="employeeTable">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>생년월일</th>
                                <th>입사일</th>
                                <th>부서</th>
                                <th>아이디</th>
                                <th>메일주소</th>
                            </tr>
                        </thead>
                        <tbody class="employeeTableBody">
                            <tr class="employeeEmptyRow">
                                <td colspan="6">등록된 구성원이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="employeePagination" id="employeePagination" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="employeeModal" id="departmentModal" style="display:none;">
        <div class="employeeModalDim departmentModalDim"></div>
        <div class="employeeModalDialog departmentModalDialog">
            <div class="employeeModalHead">
                <strong>부서 관리</strong>
                <button type="button" class="employeeModalCloseBtn" id="departmentCloseModalBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
            </div>
            <div class="employeeModalBody">
                <div class="departmentManageForm">
                    <input type="text" id="departmentNameInput" placeholder="부서명 입력">
                    <button type="button" class="employeePrimaryBtn" id="departmentAddBtn">추가</button>
                </div>
                <div class="employeeDepartmentList" id="departmentList">
                    <span class="employeeDepartmentEmpty">등록된 부서가 없습니다.</span>
                </div>
            </div>
        </div>
    </div>

    <div class="employeeModal" id="employeeSettingModal" style="display:none;">
        <div class="employeeModalDim employeeSettingModalDim"></div>
        <div class="employeeModalDialog employeeSettingModalDialog">
            <div class="employeeModalHead">
                <strong class="employeeSettingTitle">구성원 설정</strong>
                <button type="button" class="employeeModalCloseBtn" id="employeeSettingCloseBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
            </div>
            <div class="employeeModalBody">
                <div class="employeeFormGrid employeeSettingGrid">
                    <div class="employeeField employeeIdField">
                        <label for="employeeSettingIdInput">아이디</label>
                        <div class="employeeIdInputRow">
                            <input type="text" id="employeeSettingIdInput" readonly>
                            <span class="emaild_val">@autonecar.kr</span>
                        </div>
                    </div>
                    <div class="employeeField employeeHiddenField">
                        <span class="employeeSettingEmail">-</span>
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingNameInput">이름</label>
                        <input type="text" id="employeeSettingNameInput">
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingDepartment">부서</label>
                        <select id="employeeSettingDepartment">
                            <option value="">부서 미지정</option>
                        </select>
                    </div>
                    <div class="employeeInlineRow">
                        <div class="employeeField">
                            <label for="employeeSettingJobGrade">직책</label>
                            <select id="employeeSettingJobGrade">
                                <option value="">직책 미지정</option>
                                <option value="팀원">팀원</option>
                                <option value="선임 팀원">선임 팀원</option>
                                <option value="파트 리더">파트 리더</option>
                                <option value="팀장">팀장</option>
                                <option value="수석 팀장">수석 팀장</option>
                                <option value="부서장">부서장</option>
                                <option value="대표">대표</option>
                            </select>
                        </div>
                        <div class="employeeField">
                            <label for="employeeSettingPosition">직위</label>
                            <select id="employeeSettingPosition">
                                <option value="">직위 미지정</option>
                                <option value="사원">사원</option>
                                <option value="주임">주임</option>
                                <option value="대리">대리</option>
                                <option value="과장">과장</option>
                                <option value="차장">차장</option>
                                <option value="부장">부장</option>
                            </select>
                        </div>
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingRole">사용자 유형</label>
                        <select id="employeeSettingRole">
                            <option value="staff">임직원</option>
                            <option value="admin">대표(관리자)</option>
                        </select>
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingMobilePhone">휴대전화</label>
                        <input type="text" id="employeeSettingMobilePhone" placeholder="010-0000-0000" inputmode="numeric" maxlength="13">
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingDirectPhone">내선번호</label>
                        <div class="employeeDirectPhoneRow">
                            <input type="text" id="employeeSettingDirectPhone" placeholder="010-0000-0000" inputmode="numeric" maxlength="13">
                            <label class="employeeNoDirectLabel" for="employeeSettingDirectPhoneNone">
                                <input type="checkbox" id="employeeSettingDirectPhoneNone">
                                <span>없음</span>
                            </label>
                        </div>
                    </div>
                    <div class="employeeField employeeHiddenField">
                        <input type="text" id="employeeSettingEmployeeNumber" readonly>
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingBirthDate">생년월일</label>
                        <div class="employeeDateSelectGroup">
                            <select id="employeeSettingBirthYear" class="employeeDateSelect">
                                <option value="">연도</option>
                            </select>
                            <select id="employeeSettingBirthMonth" class="employeeDateSelect">
                                <option value="">월</option>
                            </select>
                            <select id="employeeSettingBirthDay" class="employeeDateSelect">
                                <option value="">일</option>
                            </select>
                        </div>
                        <input type="hidden" id="employeeSettingBirthDate">
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingHireDate">입사일</label>
                        <div class="employeeDateSelectGroup">
                            <select id="employeeSettingHireYear" class="employeeDateSelect">
                                <option value="">연도</option>
                            </select>
                            <select id="employeeSettingHireMonth" class="employeeDateSelect">
                                <option value="">월</option>
                            </select>
                            <select id="employeeSettingHireDay" class="employeeDateSelect">
                                <option value="">일</option>
                            </select>
                        </div>
                        <input type="hidden" id="employeeSettingHireDate">
                    </div>
                    <div class="employeeField">
                        <label for="employeeSettingWorkStart">근무시간</label>
                        <div class="employeeTimeRange">
                            <select id="employeeSettingWorkStart" class="employeeTimeSelect">
                                <option value="">--:--</option>
                            </select>
                            <span>~</span>
                            <select id="employeeSettingWorkEnd" class="employeeTimeSelect">
                                <option value="">--:--</option>
                            </select>
                        </div>
                    </div>
                    <div class="employeeField employeeWeeklyScheduleField" id="employeeSettingWeeklyScheduleField" style="display:none;">
                        <label>요일별 근무</label>
                        <div class="employeeWeeklyScheduleBox">
                            <p><strong>월/수/금</strong><span>09:00 ~ 18:00</span></p>
                            <p><strong>화/목</strong><span>09:00 ~ 19:00</span></p>
                        </div>
                    </div>
                    <div class="employeeField employeeSignatureField" id="employeeSettingSignatureField" style="display:none;">
                        <label for="employeeSettingSignatureInput">결재선 서명 등록</label>
                        <input type="file" id="employeeSettingSignatureInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png">
                        <div class="employeeSignaturePreview" id="employeeSettingSignaturePreview">등록된 서명이 없습니다.</div>
                        <button type="button" class="employeeSecondaryBtn employeeSignatureRemoveBtn" id="employeeSettingSignatureRemoveBtn">서명 삭제</button>
                    </div>
                </div>
                <div class="employeeSettingActions">
                    <button type="button" class="employeePrimaryBtn" id="employeeSettingSaveBtn">수정완료</button>
                    <button type="button" class="employeeSecondaryBtn" id="employeeSettingResetBtn">비밀번호 초기화</button>
                    <button type="button" class="employeeDangerBtn" id="employeeSettingDeleteBtn">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <div class="employeeModal" id="employeeModal" style="display:none;">
        <div class="employeeModalDim"></div>
        <div class="employeeModalDialog">
            <div class="employeeModalHead">
                <strong>구성원 추가</strong>
                <button type="button" class="employeeModalCloseBtn" id="employeeCloseModalBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="#1b1b1b" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
            </div>
            <div class="employeeModalBody">
                <div class="employeeFormGrid">
                    <div class="employeeField employeeIdField">
                        <label for="employeeId">아이디</label>
                        <div class="employeeIdInputRow">
                            <input type="text" id="employeeId">
                            <span class="emaild_val">@autonecar.kr</span>
                        </div>
                    </div>
                    <div class="employeeField employeeHiddenField">
                        <span class="employeePreviewEmail"></span>
                    </div>
                    <div class="employeeField">
                        <label for="employeeName">이름</label>
                        <input type="text" id="employeeName">
                    </div>
                    <div class="employeeField">
                        <label for="employeeDepartment">부서</label>
                        <select id="employeeDepartment">
                            <option value="">부서 미지정</option>
                        </select>
                    </div>
                    <div class="employeeInlineRow">
                        <div class="employeeField">
                            <label for="employeeJobGrade">직책</label>
                            <select id="employeeJobGrade">
                                <option value="">직책 미지정</option>
                                <option value="팀원">팀원</option>
                                <option value="선임 팀원">선임 팀원</option>
                                <option value="파트 리더">파트 리더</option>
                                <option value="팀장">팀장</option>
                                <option value="수석 팀장">수석 팀장</option>
                                <option value="부서장">부서장</option>
                                <option value="대표">대표</option>
                            </select>
                        </div>
                        <div class="employeeField">
                            <label for="employeePosition">직위</label>
                            <select id="employeePosition">
                                <option value="">직위 미지정</option>
                                <option value="사원">사원</option>
                                <option value="주임">주임</option>
                                <option value="대리">대리</option>
                                <option value="과장">과장</option>
                                <option value="차장">차장</option>
                                <option value="부장">부장</option>
                            </select>
                        </div>
                    </div>
                    <div class="employeeField">
                        <label for="employeeRole">사용자 유형</label>
                        <select id="employeeRole">
                            <option value="staff">임직원</option>
                            <option value="admin">대표(관리자)</option>
                        </select>
                    </div>
                    <div class="employeeField">
                        <label for="employeeMobilePhone">휴대전화</label>
                        <input type="text" id="employeeMobilePhone" placeholder="010-0000-0000" inputmode="numeric" maxlength="13">
                    </div>
                    <div class="employeeField">
                        <label for="employeeDirectPhone">내선번호</label>
                        <div class="employeeDirectPhoneRow">
                            <input type="text" id="employeeDirectPhone" placeholder="010-0000-0000" inputmode="numeric" maxlength="13">
                            <label class="employeeNoDirectLabel" for="employeeDirectPhoneNone">
                                <input type="checkbox" id="employeeDirectPhoneNone">
                                <span>없음</span>
                            </label>
                        </div>
                    </div>
                    <div class="employeeField employeeHiddenField">
                        <input type="text" id="employeeNumberPreview" value="자동 생성" readonly>
                    </div>
                    <div class="employeeField">
                        <label for="employeeBirthDate">생년월일</label>
                        <div class="employeeDateSelectGroup">
                            <select id="employeeBirthYear" class="employeeDateSelect">
                                <option value="">연도</option>
                            </select>
                            <select id="employeeBirthMonth" class="employeeDateSelect">
                                <option value="">월</option>
                            </select>
                            <select id="employeeBirthDay" class="employeeDateSelect">
                                <option value="">일</option>
                            </select>
                        </div>
                        <input type="hidden" id="employeeBirthDate">
                    </div>
                    <div class="employeeField">
                        <label for="employeeHireDate">입사일</label>
                        <div class="employeeDateSelectGroup">
                            <select id="employeeHireYear" class="employeeDateSelect">
                                <option value="">연도</option>
                            </select>
                            <select id="employeeHireMonth" class="employeeDateSelect">
                                <option value="">월</option>
                            </select>
                            <select id="employeeHireDay" class="employeeDateSelect">
                                <option value="">일</option>
                            </select>
                        </div>
                        <input type="hidden" id="employeeHireDate">
                    </div>
                    <div class="employeeField">
                        <label for="employeeWorkStart">근무시간</label>
                        <div class="employeeTimeRange">
                            <select id="employeeWorkStart" class="employeeTimeSelect">
                                <option value="">--:--</option>
                            </select>
                            <span>~</span>
                            <select id="employeeWorkEnd" class="employeeTimeSelect">
                                <option value="">--:--</option>
                            </select>
                        </div>
                    </div>
                    <div class="employeeField employeeWeeklyScheduleField" id="employeeWeeklyScheduleField" style="display:none;">
                        <label>요일별 근무</label>
                        <div class="employeeWeeklyScheduleBox">
                            <p><strong>월/수/금</strong><span>09:00 ~ 18:00</span></p>
                            <p><strong>화/목</strong><span>09:00 ~ 19:00</span></p>
                        </div>
                    </div>
                    <div class="employeeField employeeSignatureField" id="employeeSignatureField" style="display:none;">
                        <label for="employeeSignatureInput">결재선 서명 등록</label>
                        <input type="file" id="employeeSignatureInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png">
                        <div class="employeeSignaturePreview" id="employeeSignaturePreview">등록된 서명이 없습니다.</div>
                        <button type="button" class="employeeSecondaryBtn employeeSignatureRemoveBtn" id="employeeSignatureRemoveBtn">서명 삭제</button>
                    </div>
                </div>
                <div class="employeeFormActions">
                    <button type="button" class="employeePrimaryBtn" id="employeeCreateBtn">추가하기</button>
                </div>
            </div>
        </div>
    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>

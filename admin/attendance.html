<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>오토원워크</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0373ef">
    <meta name="application-name" content="오토원워크">
    <link rel="icon" type="image/png" href="/img/app_ico.png">
    <script src="/layout/config.js?v=20260522-sidebar1"></script>
    <script src="/layout/api.js?v=20260513-2"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/xeicon/2/xeicon.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link href="../layout/app.css?v=20260530-modal-keys1" rel="stylesheet">
    <link href="./admin.css?v=20260527-admin-sidebar20" rel="stylesheet">
    <script type="module" src="../layout/auth.js?v=20260513-8"></script>
    <script type="module" src="../layout/app.js?v=20260530-modal-keys1"></script>
    <script src="./adminLayout.js?v=20260527-admin-sidebar20"></script>
    <script type="module" src="./attendanceAdmin.js?v=20260520-3"></script>
</head>
<body class="adminPageLayout workbenchLayoutPage is-admin-layout">
    <div id="wrap">
        <div id="container">
            <div id="contents" class="contents">
                <div data-include-html="/gnbMenu.html"></div>
                <div class="mainArea">
    <div class="siteSheet">
        <div class="settingsArea attendAdminPage">
            <div class="titleArea">
                <h3>근태 관리</h3>
                <span class="attendAdminDateLabel">-</span>
            </div>
            <div class="attendPanel attendAdminSummaryPanel">
                <div class="attendAdminSummary">
                    <div class="attendAdminSummaryCard">
                        <span>전체인원</span>
                        <strong class="attendAdminTotalCount">0</strong>
                    </div>
                    <div class="attendAdminSummaryCard">
                        <span>출근완료</span>
                        <strong class="attendAdminCheckInCount">0</strong>
                    </div>
                    <div class="attendAdminSummaryCard">
                        <span>퇴근완료</span>
                        <strong class="attendAdminCheckOutCount">0</strong>
                    </div>
                    <div class="attendAdminSummaryCard">
                        <span>미출근</span>
                        <strong class="attendAdminMissingCount">0</strong>
                    </div>
                </div>
            </div>
            <div class="attendPanel attendAdminListPanel">
                <div class="attendHistoryTableWrap">
                    <table class="attendHistoryTable attendAdminTable">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>아이디</th>
                                <th>출근</th>
                                <th>퇴근</th>
                                <th>총 근무시간</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody class="attendAdminBody">
                            <tr class="attendEmptyRow">
                                <td colspan="6">표시할 직원 근태 정보가 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
